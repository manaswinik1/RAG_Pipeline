[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic",
    "sentence-transformers",
    "rank-bm25",
    "pinecone",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
